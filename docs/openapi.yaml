openapi: 3.1.0
info:
  title: Adoption Service API
  description: API for managing pets, pet pictures, and adoption applications.
  version: 1.0.0
  contact:
    name: Adoption Service Team
    email: support@example.com
servers:
  - url: http://localhost:8080
paths:
  /auth/login:
    post:
      summary: Login with email and password
      description: Validates client credentials and issues a JWT bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login with a JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /pets:
    get:
      summary: List pets with optional filters
      description: >-
        Returns pets filtered by the provided parameters.
        When no status parameter is provided, only AVAILABLE pets are returned.
      parameters:
        - name: species
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Species'
        - name: breed
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Breed'
        - name: sex
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PetSex'
          description: Filter by pet sex
        - name: minAgeMonths
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Minimum age in months (inclusive)
        - name: maxAgeMonths
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Maximum age in months (inclusive)
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PetStatus'
          description: Pet status filter. Defaults to AVAILABLE when omitted.
      responses:
        '200':
          description: Filtered list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetResponse'
    post:
      summary: Create a new pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetCreateRequest'
      responses:
        '201':
          description: Created pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
      security:
        - bearerAuth: []
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get pet details
      responses:
        '200':
          description: Pet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Partially update a pet
      description: >-
        Applies a partial update to a pet. Any provided fields are updated.
        When the pictures array is provided, it is merged with the existing picture list:
        matching pictures remain, missing pictures are removed, and new pictures are added.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPetRequest'
      responses:
        '200':
          description: Updated pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
  /pets/{petId}/pictures:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: List picture IDs for a pet
      responses:
        '200':
          description: Picture identifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /pets/{petId}/pictures/{pictureId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: pictureId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get a picture by ID for a pet
      responses:
        '200':
          description: Picture binary data
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Picture or pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users:
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /users/{userId}:
    get:
      summary: Get a user
      description: >-
        Organization users can read any user. Regular users can only read their own profile.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /applications:
    get:
      summary: List adoption applications
      description: >-
        Organization users see all applications. Regular users only see their own applications.
        Results are paginated; response is a Page object with content, totalElements, and totalPages.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Zero-based page index
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: createdAt,desc
          description: Sort property and direction, e.g. createdAt,desc or id,asc
      responses:
        '200':
          description: Paginated list of applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Submit an adoption application
      description: The authenticated user is the applicant.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
      responses:
        '201':
          description: Created application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /applications/{applicationId}:
    parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get an adoption application
      description: >-
        Organization users can read any application. Regular users can only read their own applications.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update an adoption application
      description: Only organization users can review or update applications.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdateRequest'
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token
        expiresAt:
          type: string
          format: date-time
        userId:
          type: integer
          format: int64
        userType:
          $ref: '#/components/schemas/UserType'
        name:
          type: string
    PetCreateRequest:
      type: object
      required:
        - name
        - species
        - sex
        - status
        - pictures
      example:
        name: Milo
        species: FELINE
        breed: SIAMESE
        ageMonths: 12
        description: Friendly cat
        status: AVAILABLE
        pictures:
          - iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAACklEQVR4nGMAAIAAG4hWK5AAAAAElFTkSuQmCC
        specialConditions:
          - Three legs
      properties:
        name:
          type: string
        species:
          $ref: '#/components/schemas/Species'
        breed:
          $ref: '#/components/schemas/Breed'
          nullable: true
        ageMonths:
          type: integer
          format: int32
          nullable: true
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/PetStatus'
        pictures:
          type: array
          items:
            type: string
            format: binary
    PetUpdateRequest:
      type: object
      description: >-
        Full replacement request for a pet. All fields are required and the request replaces the pet record.
        The pictures array replaces the existing picture list for the pet.
      required:
        - name
        - species
        - breed
        - sex
        - ageMonths
        - description
        - status
        - pictures
      properties:
        name:
          type: string
        species:
          $ref: '#/components/schemas/Species'
        breed:
          $ref: '#/components/schemas/Breed'
        sex:
          $ref: '#/components/schemas/PetSex'
        ageMonths:
          type: integer
          format: int32
        description:
          type: string
        status:
          $ref: '#/components/schemas/PetStatus'
        pictures:
          type: array
          items:
            type: string
            format: binary
    PatchPetRequest:
      type: object
      description: >-
        Partial update request for a pet. Any field may be omitted. When the pictures array is included,
        it is merged with the existing picture list.
      properties:
        name:
          type: string
        species:
          $ref: '#/components/schemas/Species'
        breed:
          $ref: '#/components/schemas/Breed'
          nullable: true
        sex:
          $ref: '#/components/schemas/PetSex'
        ageMonths:
          type: integer
          format: int32
          nullable: true
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/PetStatus'
        pictures:
          type: array
          items:
            type: string
            format: binary
    PetResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        species:
          $ref: '#/components/schemas/Species'
        breed:
          $ref: '#/components/schemas/Breed'
          nullable: true
        sex:
          $ref: '#/components/schemas/PetSex'
        ageMonths:
          type: integer
          format: int32
          nullable: true
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/PetStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        pictureCount:
          type: integer
          format: int32
        firstPictureId:
          type: integer
          format: int64
          nullable: true
          description: ID of the first picture, or null if the pet has no pictures
        conditionsCount:
          type: integer
          format: int32
    PetStatus:
      type: string
      enum:
        - AVAILABLE
        - PENDING
        - ADOPTED
    PetSex:
      type: string
      enum:
        - MALE
        - FEMALE
        - UNKNOWN
    Species:
      type: string
      enum:
        - FELINE
        - CANINE
    Breed:
      type: string
      enum:
        - SIAMESE
        - PERSIAN
        - MAINE_COON
        - RAGDOLL
        - BENGAL
        - BRITISH_SHORTHAIR
        - ABYSSINIAN
        - RUSSIAN_BLUE
        - LABRADOR
        - GERMAN_SHEPHERD
        - POODLE
        - BULLDOG
        - BEAGLE
        - GOLDEN_RETRIEVER
        - FRENCH_BULLDOG
        - MIXED
    UserType:
      type: string
      enum:
        - REGULAR
        - ORGANIZATION
    UserCreateRequest:
      type: object
      required:
        - userType
        - name
        - lastName
        - email
        - password
        - city
        - phoneNumber
      properties:
        userType:
          $ref: '#/components/schemas/UserType'
        name:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        city:
          type: string
        phoneNumber:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userType:
          $ref: '#/components/schemas/UserType'
        name:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        city:
          type: string
        phoneNumber:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicationCreateRequest:
      type: object
      required:
        - petId
        - applicantName
        - applicantEmail
        - applicantPhone
      description: The authenticated user is the applicant.
      properties:
        petId:
          type: integer
          format: int64
        applicantName:
          type: string
        applicantEmail:
          type: string
          format: email
        applicantPhone:
          type: string
        message:
          type: string
          nullable: true
    ApplicationUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        reviewNotes:
          type: string
          nullable: true
    ApplicationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        petId:
          type: integer
          format: int64
        applicantName:
          type: string
        applicantEmail:
          type: string
          format: email
        applicantPhone:
          type: string
        message:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        reviewNotes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicationPage:
      type: object
      description: Spring Data page wrapper returned by list endpoints.
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
          description: Current page index (zero-based)
        size:
          type: integer
          format: int32
          description: Page size
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    ApplicationStatus:
      type: string
      enum:
        - PENDING
        - NEEDS_INFO
        - APPROVED
        - REJECTED
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
